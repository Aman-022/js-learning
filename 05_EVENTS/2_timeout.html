<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> JS LEARNING </h1>
    <button id = "stop" > STOP </button>
</body>
<script>
    setTimeout(function(){
        console.log("AMAN")
    },2000) // it call api 

    const changetext = function(){
        document.querySelector('h1').innerHTML= "LEARN JS "
    }

   const chnageme= setTimeout(changetext,3000);
    // let say , anytimeout doesnt execute in particular time then we can remove it after particular time 
    // clearTimeout(chnageme)

    document.querySelector("#stop").addEventListener('click',function(e){
            clearTimeout(chnageme)
            console.log("stopped")
    },false)
</script>
</html>
