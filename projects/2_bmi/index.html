<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>BMI Calculator</h1>

    <form id="bmi-form">
        <label for="height">Height (cm):</label>
        <input type="number" id="height" placeholder="Enter height" required>

        <br><br>

        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" placeholder="Enter weight" required>

        <br><br>

        <button type="submit">Calculate BMI</button>
    </form>

    <h2 id="result"></h2>

    <hr>

    <h2>BMI Guidelines</h2>

    <ul>
        <li><strong>Below 18.5:</strong> Underweight</li>
        <li><strong>18.5–24.9:</strong> Normal weight</li>
        <li><strong>25.0–29.9:</strong> Overweight</li>
        <li><strong>30.0 and above:</strong> Obesity</li>
    </ul>

    <p>
        <strong>Note:</strong> These categories are general guidelines for adults.
        BMI is a screening tool, not a complete measure of health.
    </p>

    <script src="script.js"></script>

</body>
</html>
